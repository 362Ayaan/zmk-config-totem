CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Active dashboard -> Merry after 10 seconds -> panel/backlight off five
# minutes later. ZMK sleep remains disabled by the dongle shield because this
# USB-powered central must stay available to all three peripherals.
CONFIG_ZMK_IDLE_TIMEOUT=10000
CONFIG_MERRY_SCREEN_OFF_DELAY_MS=300000

# A 10% RGB565 draw buffer is about 11.5 KB. Merry owns one separately allocated
# 160x174 RGB565 frame (55,680 bytes), avoiding a 115,200-byte full framebuffer.
CONFIG_LV_Z_MEM_POOL_SIZE=16000

CONFIG_SPI=y
CONFIG_ST7789V=y
CONFIG_PWM=y
CONFIG_LED=y
CONFIG_FLASH=y
CONFIG_NORDIC_QSPI_NOR=y

# Composite USB HID + the XIAO board's existing CDC port for atomic pet-pack
# updates. Release firmware intentionally leaves ZMK USB logging disabled so
# the CDC stream is never shared with logs.
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=1024
