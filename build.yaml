include:
  # Phase 1 dongle: spare XIAO is the split central and drives the OLED.
  - board: xiao_ble//zmk
    shield: totem_dongle xiao_ssd1306
    artifact-name: dongle-ssd1306

  # New 240x240 target. Kept separate so the proven SSD1306 firmware remains
  # available as a rollback while Merry is brought up on hardware.
  - board: xiao_ble//zmk
    shield: totem_dongle xiao_st7789_merry
    artifact-name: dongle-st7789-merry

  # Two-board development target: nRF remains the USB HID/split central and
  # forwards the proven Merry binary protocol to the ESP32-S3 over SPI.
  - board: xiao_ble//zmk
    shield: totem_dongle xiao_esp32_bridge
    artifact-name: dongle-esp32-bridge

  # Raw electrical/panel diagnostic: three backlight flashes, then GPIO-driven
  # mode-3 full-screen red/green/blue/white/black cycling. This bypasses LVGL,
  # the Zephyr display/SPI drivers, QSPI, and pet animation code.
  - board: xiao_ble//zmk
    shield: totem_dongle xiao_st7789_diag
    artifact-name: dongle-st7789-diagnostic

  # Keyboard halves become BLE peripherals only after the dongle is ready.
  - board: xiao_ble//zmk
    shield: totem_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: left-peripheral
  - board: xiao_ble//zmk
    shield: totem_right
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: right-peripheral

  # Standalone AS5600 dial; it forwards wheel events to the dongle over ZMK split BLE.
  - board: xiao_ble//zmk
    shield: totem_dial
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: as5600-dial-peripheral

  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: settings-reset

  # Rollback images restore the original left-central split architecture.
  - board: xiao_ble//zmk
    shield: totem_left
    artifact-name: rollback-left-central
  - board: xiao_ble//zmk
    shield: totem_right
    artifact-name: rollback-right-peripheral

  # Temporary bring-up images: identical to the release builds above, plus USB
  # CDC logging, and on the dial also per-event driver instrumentation. ZMK
  # already defaults ZMK_LOG_LEVEL to 4, so no log-level flag is needed. Use
  # these only to isolate which stage is failing (AS5600 -> dial I2C,
  # dial -> dongle split BLE, dongle -> host HID). Not daily firmware.
  - board: xiao_ble//zmk
    shield: totem_dial
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n -DCONFIG_ZMK_USB_LOGGING=y -DCONFIG_INPUT_AS5600_SCROLL_DIAGNOSTICS=y
    artifact-name: as5600-dial-peripheral-debug
  - board: xiao_ble//zmk
    shield: totem_dongle xiao_ssd1306
    cmake-args: -DCONFIG_ZMK_USB_LOGGING=y
    artifact-name: dongle-ssd1306-debug
