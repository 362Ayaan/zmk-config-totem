name: Diagnose AS5600 dial

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/diagnose-dial.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    steps:
      - uses: actions/checkout@v7

      - name: Prepare and build dial
        id: dial_build
        shell: bash
        run: |
          set +e
          {
            mkdir -p /tmp/zmk-config/config
            cp -R config/* /tmp/zmk-config/config/
            cd /tmp/zmk-config
            west init -l config
            west update --fetch-opt=--filter=tree:0
            west zephyr-export
            west build -s /tmp/zmk-config/zmk/app -d /tmp/dial-build \
              -b xiao_ble//zmk -- \
              -DZMK_CONFIG=/tmp/zmk-config/config \
              -DSHIELD=totem_dial \
              -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}" \
              -DCONFIG_ZMK_SPLIT=y \
              -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
          } > /tmp/dial-build.log 2>&1
          echo "$?" > /tmp/dial-build.status
          exit 0

      - name: Publish diagnostic tail
        shell: bash
        run: |
          tail -n 40 /tmp/dial-build.log | tac \
            | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' \
            | while IFS= read -r line; do echo "::error file=.github/workflows/diagnose-dial.yml,line=1,title=AS5600 dial build::$line"; done
          exit "$(cat /tmp/dial-build.status)"
