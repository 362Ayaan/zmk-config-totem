name: Diagnose AS5600 dial

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/diagnose-dial.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    steps:
      - uses: actions/checkout@v7

      - name: Prepare workspace
        run: |
          mkdir -p /tmp/zmk-config/config
          cp -R config/* /tmp/zmk-config/config/
          cd /tmp/zmk-config
          west init -l config
          west update --fetch-opt=--filter=tree:0
          west zephyr-export

      - name: Build dial and capture diagnostics
        id: dial_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          west build -s /tmp/zmk-config/zmk/app -d /tmp/dial-build \
            -b xiao_ble//zmk -- \
            -DZMK_CONFIG=/tmp/zmk-config/config \
            -DSHIELD=totem_dial \
            -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}" \
            -DCONFIG_ZMK_SPLIT=y \
            -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n 2>&1 | tee /tmp/dial-build.log

      - name: Publish compiler errors
        if: steps.dial_build.outcome == 'failure'
        shell: bash
        run: |
          grep -E "(error:|CMake Error|devicetree error|Kconfig error|FAILED:)" /tmp/dial-build.log \
            | tail -n 20 \
            | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' \
            | while IFS= read -r line; do echo "::error title=AS5600 dial build::$line"; done
          exit 1
